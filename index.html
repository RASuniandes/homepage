<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/RAS_oficial_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAS Uniandes — Robótica, innovación y compromiso social</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta property="og:type" content="website" />

    <meta property="og:title" content="RAS Uniandes — Robótica, innovación y compromiso social" />

    <!-- Twitter/X card (some apps fall back to this) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RAS Uniandes" />
    <meta name="twitter:description" content="Capítulo estudiantil de la IEEE Robotics & Automation Society en la Universidad de los Andes." />
    <meta name="twitter:image" content="/RAS_oficial_logo.png" />
    <script>
      (function(){
        var s=localStorage.getItem('ras-theme');
        if(s) document.documentElement.setAttribute('data-theme',s);
        else if(window.matchMedia('(prefers-color-scheme:dark)').matches) document.documentElement.setAttribute('data-theme','dark');
        else document.documentElement.setAttribute('data-theme','light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
